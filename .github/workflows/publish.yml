name: Build and publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      # npm 11.5.1+ 在 GitHub Actions 下自动用 OIDC (id-token: write) 换取临时凭据
      - name: Publish (Trusted Publishing / OIDC, no token)
        run: npm publish --access public --provenance
      #  token 兜底：若 OIDC 未开通，改用下面两步并删除上面的 publish 步骤
      #  - uses: actions/setup-node@v4
      #    with:
      #      node-version: "20"
      #      registry-url: "https://registry.npmjs.org"
      #  - run: npm publish --access public
      #    env:
      #      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
